# ==========================================
# Application Configuration
# ==========================================
spring.application.name=expense-tracker

# ==========================================
# MySQL Database Configuration
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# JWT Configuration
# ==========================================
# Use a long random secret key (min 256 bits for HS256)
app.jwt.secret=your_super_secret_jwt_key_must_be_at_least_256_bits_long_please_change_this
app.jwt.expiration=86400000

# ==========================================
# OpenAI Configuration
# ==========================================
openai.api.key=XXXXXXXXX (your own generated open ai api secret key)
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-3.5-turbo

# ==========================================
# Server Configuration
# ==========================================
server.port=8080

# Allow CORS (for frontend on different port)
spring.mvc.cors.allowed-origins=*
