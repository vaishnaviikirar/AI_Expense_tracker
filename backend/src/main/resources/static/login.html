<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">

    <div class="auth-split">
        <!-- LEFT PANEL - Branding -->
        <div class="auth-brand-panel">
            <div class="brand-content">
                <div class="brand-logo">
                    <span class="logo-icon">₹</span>
                </div>
                <h1 class="brand-headline">Track Smarter.<br>Save Better.</h1>
                <p class="brand-sub">AI-powered expense tracking that learns your habits and helps you build wealth.</p>
                <div class="brand-stats">
                    <div class="stat-pill">
                        <span class="stat-num">AI</span>
                        <span class="stat-label">Budget Advisor</span>
                    </div>
                    <div class="stat-pill">
                        <span class="stat-num">JWT</span>
                        <span class="stat-label">Secured</span>
                    </div>
                    <div class="stat-pill">
                        <span class="stat-num">∞</span>
                        <span class="stat-label">Expenses</span>
                    </div>
                </div>
            </div>
            <div class="brand-decor">
                <div class="circle c1"></div>
                <div class="circle c2"></div>
                <div class="circle c3"></div>
            </div>
        </div>

        <!-- RIGHT PANEL - Form -->
        <div class="auth-form-panel">
            <div class="form-container">
                <div class="form-header">
                    <h2>Welcome back</h2>
                    <p>Sign in to your account</p>
                </div>

                <div id="errorAlert" class="alert alert-error" style="display:none;"></div>
                <div id="successAlert" class="alert alert-success" style="display:none;"></div>

                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            required
                        />
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        />
                    </div>

                    <button type="submit" class="btn-primary" id="loginBtn">
                        <span class="btn-text">Sign In</span>
                        <span class="btn-loader" style="display:none;">Signing in...</span>
                    </button>
                </form>

                <p class="auth-switch">
                    Don't have an account?
                    <a href="register.html" class="auth-link">Create one →</a>
                </p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
