<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dashboard-page">

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="nav-brand">
            <span class="logo-icon">₹</span>
        </div>
        <div class="nav-right">
            <span class="nav-greeting">Hello, <strong id="userName">User</strong></span>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="dashboard-main">

        <!-- STATS CARDS ROW -->
        <section class="stats-row">
            <div class="stat-card stat-total">
                <div class="stat-card-icon">💰</div>
                <div class="stat-card-info">
                    <span class="stat-card-label">Total Spent</span>
                    <span class="stat-card-value" id="totalSpent">₹0.00</span>
                </div>
            </div>
            <div class="stat-card stat-count">
                <div class="stat-card-icon">📋</div>
                <div class="stat-card-info">
                    <span class="stat-card-label">Total Expenses</span>
                    <span class="stat-card-value" id="totalCount">0</span>
                </div>
            </div>
            <div class="stat-card stat-category">
                <div class="stat-card-icon">🏷️</div>
                <div class="stat-card-info">
                    <span class="stat-card-label">Top Category</span>
                    <span class="stat-card-value" id="topCategory">–</span>
                </div>
            </div>
            <div class="stat-card stat-recent">
                <div class="stat-card-icon">📅</div>
                <div class="stat-card-info">
                    <span class="stat-card-label">Latest Expense</span>
                    <span class="stat-card-value" id="latestExpense">–</span>
                </div>
            </div>
        </section>

        <!-- TWO-COLUMN LAYOUT -->
        <div class="dashboard-grid">

            <!-- LEFT COLUMN: Add Expense Form -->
            <section class="card add-expense-card">
                <div class="card-header">
                    <h2 class="card-title">Add Expense</h2>
                    <span class="card-badge">New</span>
                </div>

                <div id="formError" class="alert alert-error" style="display:none;"></div>
                <div id="formSuccess" class="alert alert-success" style="display:none;"></div>

                <form id="expenseForm" class="expense-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Title</label>
                            <input type="text" id="expTitle" placeholder="e.g. Lunch at cafe" required />
                        </div>
                        <div class="form-group">
                            <label>Amount (₹)</label>
                            <input type="number" id="expAmount" placeholder="0.00" min="0.01" step="0.01" required />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Category</label>
                            <select id="expCategory" required>
                                <option value="">Select category</option>
                                <option value="Food">🍔 Food</option>
                                <option value="Travel">✈️ Travel</option>
                                <option value="Shopping">🛍️ Shopping</option>
                                <option value="Bills">⚡ Bills & Utilities</option>
                                <option value="Healthcare">🏥 Healthcare</option>
                                <option value="Entertainment">🎬 Entertainment</option>
                                <option value="Education">📚 Education</option>
                                <option value="Groceries">🛒 Groceries</option>
                                <option value="Rent">🏠 Rent</option>
                                <option value="Other">📦 Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="expDate" required />
                        </div>
                    </div>

                    <button type="submit" class="btn-primary btn-full" id="addExpBtn">
                        <span class="btn-text">+ Add Expense</span>
                        <span class="btn-loader" style="display:none;">Adding...</span>
                    </button>
                </form>

                <!-- AI SUGGESTION SECTION -->
                <div class="ai-section">
                    <div class="ai-section-header">
                        <div class="ai-badge">
                            <span class="ai-dot"></span>
                            <span>AI Budget Advisor</span>
                        </div>
                        <button class="btn-ai" id="aiBtn" onclick="getAiSuggestion()">
                            ✨ Get AI Suggestion
                        </button>
                    </div>

                    <div id="aiContainer" class="ai-container" style="display:none;">
                        <div id="aiContent" class="ai-content"></div>
                    </div>

                    <div id="aiLoading" class="ai-loading" style="display:none;">
                        <div class="ai-spinner"></div>
                        <span>Analyzing your expenses...</span>
                    </div>
                </div>
            </section>

            <!-- RIGHT COLUMN: Expense List -->
            <section class="card expense-list-card">
                <div class="card-header">
                    <h2 class="card-title">My Expenses</h2>
                    <div class="card-header-actions">
                        <input type="text" id="searchInput" class="search-input" placeholder="Search..." oninput="filterExpenses()" />
                        <select id="categoryFilter" class="filter-select" onchange="filterExpenses()">
                            <option value="">All Categories</option>
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Healthcare">Healthcare</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Education">Education</option>
                            <option value="Groceries">Groceries</option>
                            <option value="Rent">Rent</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div id="expenseListLoading" class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading expenses...</p>
                </div>

                <div id="emptyState" class="empty-state" style="display:none;">
                    <div class="empty-icon">📂</div>
                    <p>No expenses yet!</p>
                    <span>Add your first expense to get started.</span>
                </div>

                <div id="expenseList" class="expense-list" style="display:none;"></div>
            </section>
        </div>
    </main>

    <script src="dashboard.js"></script>
</body>
</html>
